              - generic [ref=f7e747]:
                - generic [ref=f7e748]: 5.5 当前与下运衔接
                - paragraph [ref=f7e749]: "当前大运（己卯 2017~2026）：羊金印星透出，护身有力，但已火合绊日支（壬日主被火合绊），感情事业有牵绊。辰戌冲在辛巳运中处于蓄力阶段，真正的爆发在庚辰后运。2026 年空亡午填实，为本运最后一年，表面财旺实为诱多。 重点重运（庚辰 2027~2036）：庚金印透（生体），辰戌双冲（开库取财），庚辰运是命中唯一一次印星透干 + 库冲同时到位的黄金窗口。此运必然剧变——财富剧动，但辰戌双冲 3:1（辰 1 : 戌 3），冲力极大，成败各半，慎之大事。"
