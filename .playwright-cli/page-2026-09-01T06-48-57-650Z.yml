                - paragraph [ref=f7e877]: 你赚的是平台溢价和系统收益，不是"单兵作战"的差价。宁为凤尾，不为鸡头。；逢土运（己卯 2018-2027）是财富跃升期；逢火库开（戌、午、未、卯）是财富兑现期。；逢火旺流年（亥、子）需守，逢湿土（辰、丑）需防。
