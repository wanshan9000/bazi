                - paragraph [ref=e716]: 主星智星，机敏善谋，思虑周详而善变。 中州断：天机守迁移宫，外出多变动机遇、宜机动发展，利远行、游学、变换环境以增见闻。化禄化权则外出得助、机遇良好；宜顺势应变为贵，忌恋栈旧地。 落到生活：脑子转得快、点子多，善分析也易想太多，常因过度思虑而错过时机。事业适合技术、策划、咨询、教育等动脑的活；财运属细水长流型，靠本事赚钱，不宜投机；感情心思细腻但容易猜疑，宜多些直来直去的沟通。
