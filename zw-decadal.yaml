                - paragraph [ref=e726]: 主星贵星，光明磊落，热心助人，光芒外放。本宫化禄（这个领域容易来财、有福），此宫事项多得助力、顺势而上。 中州断：太阳守事业宫，宜抛头露面、利他助人的行业，如公职、公益、销售、传媒、教育。主贵近官禄，宜争取名声地位；落陷则宜幕后操劳、凭勤恳立足。 落到生活：性情光明、热心肠，到哪里都容易成为人群里发光的那一个，但也常因揽事太多而操劳。事业宜公职、公益、销售、传媒等抛头露面的行业；财运随人缘而旺，广结善缘则财来；感情大方主动，重情义，健康上要注意用眼和心火。
