                - paragraph [ref=e783]: 主星帝星，尊贵威严，具领袖气质与大局观。 落到生活：贵气十足、自尊心强，天生有带班带队的气场，但容易放不下身段、听不进劝。事业宜走管理、统筹或开创型路径，凭威望服众；财运不错但偏向大进大出，需学会攒钱；感情上渴望被尊重，伴侣若能顺毛捧场则关系和睦。
