                - paragraph [ref=e707]: 一生命运总纲，性格气质所在 ┄ 说人话：你是哪种性格、一辈子的大方向，主要看它主星暗星，口才了得，是非分明，洞察力强。为命宫之根本，格局由此展开。 中州断：巨门坐命，暗曜口舌之星，善辩多思、心思深沉。其光在暗蔽他星，唯太阳能照。命主口才利、观察细，须以诚信与谨言化解口舌是非，最忌落陷会暗曜而多猜疑。 落到生活：口才了得、是非分明，洞察力强，适合靠嘴和笔吃饭，但言多易惹是非。事业宜传播、法律、教学、公关等口才型工作；财运靠口才与专业积累，动嘴不动手；感情爱讲道理、容易较真，宜学会少说多听、以柔化刚。
