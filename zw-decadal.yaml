                - paragraph [ref=e756]: 主星财星，刚毅果决，务实笃行，理财有力。 落到生活：刚毅务实、说到做到，是典型的实干派，做事讲效率不喜虚招。事业极适合金融、技术、军警、经营等需要果决的领域；财运是十四主星里最硬气的求财星，靠自己拼出来，但易守财过度；感情偏理性木讷，不懂浪漫，宜主动表达。
