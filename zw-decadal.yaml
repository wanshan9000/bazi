                - paragraph [ref=e747]: 主星福星，温和随性，人缘极佳，知足常乐。本宫化忌（这个领域容易费心费力、多波折），主此宫事项多耗心力，宜以平常心经营。 中州断：天同守福德宫，福星入福德，一生福气深厚、知足常乐，心态平和、享受人生。宜惜福养性、以乐助人；忌安逸过度而失进取。 落到生活：性情温和、随遇而安，人缘好、朋友多，懂得享受生活，是典型的福气星。事业宜稳定平和的岗位，不宜高压竞争；财运平稳、不愁吃穿，属于细水长流型；感情细腻黏人，重陪伴，是很好的伴侣；健康上要注意脾胃，勿贪口腹之欲。
