            - generic [ref=e469]:
              - paragraph [ref=e470]:
                - generic [ref=e471]: 【巨门入命格】
                - text: 巨门坐命，口舌之星，善辩多思，需以诚信与谨言化解口舌是非。
              - paragraph [ref=e472]: 命宫主星：巨门｜身宫：命宫｜格局以命宫三方四正（命、财帛、官禄、迁移）为纲，主一生大势。
          - generic [ref=e473]:
            - heading "四 全盘关联总纲" [level=4] [ref=e474]:
              - generic [ref=e475]: 四
              - generic [ref=e476]: 全盘关联总纲
            - generic [ref=e477]:
              - paragraph [ref=e478]:
                - generic [ref=e479]: 【生辰·五行局·命主身主】
                - text: 以「1990-6-30」生辰起盘，属火六局命。五行局定命宫起法与一生根基；命主为「贪狼」、身主为「火星」，为先天权威归属与后天晚景依托之枢。
              - paragraph [ref=e480]:
                - generic [ref=e481]: 【命宫·格局·三方四正】
                - text: 命宫坐「巨门」，身宫落「命宫（戊子）」，命局成「巨门入命格」。命盘大势以命宫三方四正（命宫、迁移、财帛、官禄）为纲领——命宫定气质、财帛看求财、官禄看事业、迁移看际遇，四宫互参方见全貌。
              - paragraph [ref=e482]:
                - generic [ref=e483]: 【生年四化】
                - text: 「福德·天同化忌」，主耗——执着耗损，主该宫之事多波折费心，宜以平常心化解；「田宅·武曲化权」，主掌——实权担当，主该宫之事可掌控、能有所为；「官禄·太阳化禄」（正属命宫三方四正），主得——财禄机遇，主该宫之事有进益、得贵人助；「夫妻·太阴化科」，主名——名声贵气，主该宫之事得认可、逢凶化吉。其中「官禄·太阳化禄」直落命宫三方四正，此生得失之重心，正与命、财、官、迁四宫相呼应，须与格局同参。
              - paragraph [ref=e484]:
                - generic [ref=e485]: 【当前大限】
                - text: 行至「田宅」宫（主星武曲、七杀），此限四化武曲、贪狼、天梁、文曲，其中「武曲化权」为生年四化之转用，主其宫所主之事在当限显化，此限不在三方四正，为较外围之十年，重在借四化而动。
              - paragraph [ref=e486]:
                - generic [ref=e487]: 【本年流年】
                - text: 落「迁移」宫（主星天机），流年四化天同、天机、文昌、廉贞，其中「天同化忌」呼应生年四化，本年吉凶以此为纲；流年与大限同参，方知当下十年如何借运而进。
              - paragraph [ref=e488]:
                - generic [ref=e489]: 【综论】
                - text: 命主「贪狼」定其权威归属，身主「火星」定其晚景依托，五行局「火六局」主其行业方向；格局定一生大势，四化定得失机枢，大限流年定当下进退——八字、宫位、星曜、四化、行运环环相扣，非一宫一星可独断。
